<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  :root{
    --bg: #0f0e0c;
    --surface: #17150f;
    --border: #322d24;
    --border-soft: #241f18;
    --text: #f2ecdf;
    --text-dim: #948b78;
    --accent: #c8a45b;
    --accent-soft: rgba(200,164,91,0.14);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(200,164,91,0.08), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    padding: 56px 24px;
  }

  .panel{
    width:100%;
    max-width: 820px;
    margin: 0 auto;
  }

  .admin-tag{
    display:inline-block;
    margin-bottom: 14px;
    opacity:0;
    animation: fadeUp 0.7s ease 0.02s forwards;
  }
  .admin-tag span{
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--accent);
    border: 1px solid var(--border);
    background: var(--accent-soft);
    padding: 4px 12px;
    border-radius: 12px;
  }

  .greeting{
    color: var(--text-dim);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    margin: 0 0 6px;
    opacity:0;
    animation: fadeUp 0.7s ease 0.05s forwards;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-style:italic;
    font-size: 2.2rem;
    margin: 0;
    letter-spacing: -0.01em;
    opacity:0;
    animation: fadeUp 0.7s ease 0.1s forwards;
  }

  .mark{
    display:flex;
    align-items:center;
    gap:14px;
    margin: 24px 0 40px;
    opacity:0;
    animation: fadeIn 0.7s ease 0.15s forwards;
  }
  .mark .line{
    height:1px;
    flex:1;
    background: linear-gradient(90deg, var(--border), transparent);
  }
  .mark .dot{
    width:5px; height:5px;
    border-radius:50%;
    background: var(--accent);
    flex-shrink:0;
  }

  .grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .section{
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 4px;
    padding: 24px 26px;
    opacity:0;
    animation: fadeUp 0.7s ease forwards;
  }
  .section:nth-of-type(1){ animation-delay: 0.2s; }
  .section:nth-of-type(2){ animation-delay: 0.26s; }
  .section:nth-of-type(3){ animation-delay: 0.32s; }
  .section:nth-of-type(4){ animation-delay: 0.38s; }

  .section h2{
    font-family:'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 1.1rem;
    margin: 0 0 16px;
    color: var(--text);
  }

  .buttons{
    display:flex;
    flex-direction: column;
    gap: 10px;
  }

  .button{
    display:block;
    padding: 10px 16px;
    text-decoration: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    border-radius: 3px;
    font-size: 0.85rem;
    letter-spacing: 0.01em;
    transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease;
  }
  .button:hover{
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }

  .button.primary{
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 0.78rem;
    text-align: center;
  }
  .button.primary:hover{
    background: var(--accent);
    color: #17150f;
  }

  .logout-row{
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid var(--border-soft);
    text-align: center;
    opacity:0;
    animation: fadeUp 0.7s ease 0.5s forwards;
  }
  .logout-row a{
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.85rem;
    border-bottom: 1px solid transparent;
    transition: border-color 0.25s ease, color 0.25s ease;
  }
  .logout-row a:hover{
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  @keyframes fadeIn{ to{ opacity:1; } }
  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .admin-tag, .greeting, h1, .mark, .section, .logout-row{ animation: none; opacity: 1; }
  }

  @media (max-width: 640px){
    h1{ font-size: 1.8rem; }
    .grid{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <div class="panel">

    <div class="admin-tag"><span>Admin</span></div>

    <p class="greeting">Welcome back</p>
    <h1>{{ request.user.username }}</h1>

    <div class="mark">
      <span class="dot"></span>
      <span class="line"></span>
    </div>

    <div class="grid">

      <div class="section">
        <h2>Features</h2>
        <div class="buttons">
          <a class="button primary" href="{% url 'create_feature' %}">Create Feature</a>
          <a class="button" href="{% url 'feature_list' %}">Manage Features</a>
        </div>
      </div>

      <div class="section">
        <h2>Plans</h2>
        <div class="buttons">
          <a class="button primary" href="{% url 'create_plan' %}">Create Plan</a>
          <a class="button" href="{% url 'plan_list' %}">Manage Plans</a>
        </div>
      </div>

      <div class="section">
        <h2>Usage</h2>
        <div class="buttons">
          <a class="button primary" href="{% url 'admin_create_usage' %}">Add Usage</a>
          <a class="button" href="{% url 'usage_list' %}">View Usage</a>
        </div>
      </div>

      <div class="section">
        <h2>Billing</h2>
        <div class="buttons">
          <a class="button primary" href="{% url 'launch_billing' %}">Launch Billing</a>
          <a class="button" href="{% url 'transaction_list' %}">View Transactions</a>
        </div>
      </div>

    </div>

    <div class="logout-row">
      <a href="{% url 'logout' %}">Logout</a>
    </div>

  </div>

</body>
</html>
