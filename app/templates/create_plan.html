<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  :root{
    --bg: #0f0e0c;
    --surface: #17150f;
    --border: #322d24;
    --border-soft: #241f18;
    --text: #f2ecdf;
    --text-dim: #948b78;
    --accent: #c8a45b;
    --accent-soft: rgba(200,164,91,0.14);
    --error: #b8624c;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(200,164,91,0.08), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 48px 20px;
  }

  .panel{
    width:100%;
    max-width: 480px;
  }

  .mark{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom: 28px;
    opacity:0;
    animation: fadeIn 0.7s ease forwards;
  }
  .mark .line{
    height:1px;
    flex:1;
    background: linear-gradient(90deg, transparent, var(--border) 40%, var(--border) 60%, transparent);
  }
  .mark .dot{
    width:5px; height:5px;
    border-radius:50%;
    background: var(--accent);
    flex-shrink:0;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-style:italic;
    font-size: 2.1rem;
    line-height:1.15;
    text-align:center;
    margin: 0 0 36px;
    letter-spacing: -0.01em;
    opacity:0;
    animation: fadeUp 0.7s ease 0.1s forwards;
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 4px;
    padding: 40px 36px;
    opacity:0;
    animation: fadeUp 0.7s ease 0.25s forwards;
  }

  form p{
    margin: 0 0 24px;
    display:flex;
    flex-direction:column;
  }

  form p label{
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--text-dim);
    margin-bottom: 10px;
    font-weight: 500;
  }

  form p input[type="text"],
  form p input[type="email"],
  form p input[type="password"],
  form p input[type="number"],
  form p input[type="date"],
  form p input[type="url"],
  form p input:not([type]),
  form p select{
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.98rem;
    padding: 8px 2px 10px;
    outline: none;
    transition: border-color 0.3s ease;
    width: 100%;
  }

  form p select{
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23948b78'/></svg>");
    background-repeat: no-repeat;
    background-position: right 4px center;
    padding-right: 20px;
  }
  form p select option{
    background: var(--surface);
    color: var(--text);
  }

  form p textarea{
    resize: vertical;
    min-height: 90px;
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 10px 12px;
    background: transparent;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.98rem;
    outline: none;
    transition: border-color 0.3s ease;
  }
  form p textarea:focus{ border-color: var(--accent); }

  form p input[type="text"]:focus,
  form p input[type="email"]:focus,
  form p input[type="password"]:focus,
  form p input[type="number"]:focus,
  form p input[type="date"]:focus,
  form p input[type="url"]:focus,
  form p input:not([type]):focus,
  form p select:focus{
    border-bottom-color: var(--accent);
  }

  form p input::placeholder{ color: #4a4438; }

  form p:has(input[type="checkbox"]),
  form p:has(input[type="radio"]){
    flex-direction: row;
    align-items: center;
    gap: 10px;
  }
  form p input[type="checkbox"],
  form p input[type="radio"]{
    accent-color: var(--accent);
    width: 16px; height:16px;
  }
  form p:has(input[type="checkbox"]) label,
  form p:has(input[type="radio"]) label{
    margin: 0;
    text-transform: none;
    letter-spacing: 0;
    font-size: 0.88rem;
    color: var(--text-dim);
    order: 2;
  }

  form ul.errorlist{
    list-style:none;
    margin: 6px 0 0;
    padding: 0;
    color: var(--error);
    font-size: 0.8rem;
  }
  form ul.errorlist li{ margin-top:2px; }

  form .helptext{
    display:block;
    color: var(--text-dim);
    font-size: 0.78rem;
    margin-top: 6px;
  }

  button[type="submit"]{
    width:100%;
    background: var(--accent);
    color: #17150f;
    border: none;
    padding: 14px 0;
    font-family:'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border-radius: 2px;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.25s ease, transform 0.15s ease;
  }
  button[type="submit"]:hover{ background: #d9b774; }
  button[type="submit"]:active{ transform: scale(0.99); }
  button[type="submit"]:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .foot{
    text-align:center;
    margin-top: 24px;
    opacity:0;
    animation: fadeUp 0.7s ease 0.4s forwards;
  }
  .foot a{
    color: var(--accent);
    text-decoration: none;
    font-size: 0.85rem;
    border-bottom: 1px solid transparent;
    transition: border-color 0.25s ease;
  }
  .foot a:hover{ border-bottom-color: var(--accent); }

  @keyframes fadeIn{ to{ opacity:1; } }
  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .mark, h1, .card, .foot{ animation: none; opacity: 1; }
  }

  @media (max-width: 480px){
    .card{ padding: 32px 24px; }
    h1{ font-size: 1.8rem; }
  }
</style>
</head>
<body>

  <div class="panel">

    <div class="mark">
      <span class="line"></span>
      <span class="dot"></span>
      <span class="line"></span>
    </div>

    <h1>Create Plan</h1>

    <div class="card">
      <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Create Plan</button>
      </form>
    </div>

    <p class="foot">
      <a href="{% url 'home' %}">← Back to Home</a>
    </p>

  </div>

</body>
</html>
