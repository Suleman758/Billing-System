<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launch Billing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  :root{
    --bg: #0f0e0c;
    --surface: #17150f;
    --border: #322d24;
    --border-soft: #241f18;
    --text: #f2ecdf;
    --text-dim: #948b78;
    --accent: #c8a45b;
    --accent-soft: rgba(200,164,91,0.14);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(200,164,91,0.08), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 48px 20px;
  }

  .panel{
    width:100%;
    max-width: 440px;
  }

  .mark{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom: 28px;
    opacity:0;
    animation: fadeIn 0.7s ease forwards;
  }
  .mark .line{
    height:1px;
    flex:1;
    background: linear-gradient(90deg, transparent, var(--border) 40%, var(--border) 60%, transparent);
  }
  .mark .dot{
    width:5px; height:5px;
    border-radius:50%;
    background: var(--accent);
    flex-shrink:0;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-style:italic;
    font-size: 2rem;
    line-height:1.15;
    text-align:center;
    margin: 0 0 20px;
    letter-spacing: -0.01em;
    opacity:0;
    animation: fadeUp 0.7s ease 0.1s forwards;
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 4px;
    padding: 36px 32px;
    text-align: center;
    opacity:0;
    animation: fadeUp 0.7s ease 0.2s forwards;
  }

  .icon-badge{
    width: 44px;
    height: 44px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--accent-soft);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon-badge svg{
    width: 20px;
    height: 20px;
    stroke: var(--accent);
    fill: none;
    stroke-width: 1.8;
  }

  .info-text{
    font-size: 0.95rem;
    line-height: 1.6;
    color: var(--text-dim);
    margin: 0 0 28px;
  }

  form{ margin: 0; }

  button[type="submit"]{
    width:100%;
    background: var(--accent);
    color: #17150f;
    border: none;
    padding: 14px 0;
    font-family:'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.25s ease, transform 0.15s ease;
  }
  button[type="submit"]:hover{ background: #d9b774; }
  button[type="submit"]:active{ transform: scale(0.99); }
  button[type="submit"]:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .foot{
    text-align:center;
    margin-top: 22px;
    opacity:0;
    animation: fadeUp 0.7s ease 0.3s forwards;
  }
  .foot a{
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.85rem;
    border-bottom: 1px solid transparent;
    transition: border-color 0.25s ease, color 0.25s ease;
  }
  .foot a:hover{
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  @keyframes fadeIn{ to{ opacity:1; } }
  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .mark, h1, .card, .foot{ animation: none; opacity: 1; }
  }

  @media (max-width: 480px){
    .card{ padding: 28px 24px; }
    h1{ font-size: 1.7rem; }
  }
</style>
</head>
<body>

  <div class="panel">

    <div class="mark">
      <span class="line"></span>
      <span class="dot"></span>
      <span class="line"></span>
    </div>

    <h1>Launch Billing</h1>

    <div class="card">

      <div class="icon-badge">
        <svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20"/></svg>
      </div>

      <p class="info-text">This will process billing for all buyers whose billing day is today.</p>

      <form method="post">
        {% csrf_token %}
        <button type="submit">Launch Billing</button>
      </form>
    </div>

    <p class="foot">
      <a href="{% url 'home' %}">Cancel</a>
    </p>

  </div>

</body>
</html>
